name: Cloudflare D1 migration

on:
  push:
    branches:
      - infra/independent-cloudflare-hosting-20260919
    paths:
      - .github/workflows/cloudflare-d1-migrate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tachocommand-d1-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply versioned migrations to tachocommand-prod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Show pending migrations
        run: npx wrangler d1 migrations list tachocommand-prod --remote

      - name: Apply versioned migrations
        run: npx wrangler d1 migrations apply tachocommand-prod --remote

      - name: Verify created tables
        run: >-
          npx wrangler d1 execute tachocommand-prod --remote
          --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"
