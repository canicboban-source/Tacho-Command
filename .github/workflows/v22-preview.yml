name: TachoCommand V22 production-baseline isolated preview
on:
  push:
    branches:
      - fix/app-v22-origin-manifest-install-20260923
    paths:
      - .github/workflows/v22-preview.yml
      - scripts/v17-production-baseline-safety.mjs
      - scripts/v19-preview-install.mjs
      - scripts/v20-calendar-install.mjs
      - scripts/v21-install-button-only.mjs
      - scripts/v22-manifest-own-origin.mjs
      - tests/v22-manifest-own-origin.test.mjs
      - lib/app-v2-monday-fortnight.js
      - tests/v20-calendar-history.test.mjs
      - app/pwa-install-cta.tsx
      - tests/v19-install-proven-read.test.mjs
      - lib/app-v2-phone-timeline.js
      - tests/v17-production-clock.test.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tachocommand-v22-production-baseline-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply only phone-timezone and landing UI changes over official main
        run: |
          set -eu
          sha256sum lib/app-v2-golden-card-browser-transport.js lib/app-v2-golden-card-protocol-core.js lib/app-v2-field-transport.js lib/app-v2-card-transport-controller-bridge.js > /tmp/production-card-transport.sha256
          node scripts/v17-production-baseline-safety.mjs
          node scripts/v19-preview-install.mjs
          node scripts/v20-calendar-install.mjs
          node scripts/v21-install-button-only.mjs
          node scripts/v22-manifest-own-origin.mjs
          sha256sum -c /tmp/production-card-transport.sha256
          git diff --exit-code -- lib/app-v2-golden-card-browser-transport.js lib/app-v2-golden-card-protocol-core.js lib/app-v2-field-transport.js lib/app-v2-card-transport-controller-bridge.js lib/app-v2-card-read-controller.js
          git diff --stat
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify production read, regression suite, phone time and safety copy
        run: |
          node --test tests/v17-production-clock.test.mjs tests/v19-install-proven-read.test.mjs tests/v20-calendar-history.test.mjs tests/app-v2-card-read-ui-wiring.test.mjs tests/app-v2-field-transport.test.mjs tests/app-v2-golden-card-browser-transport.test.mjs tests/app-v2-field-session.test.mjs tests/app-v2-card-pipeline.test.mjs tests/app-v2-parser-card-adapter.test.mjs tests/field-proven-product-state.test.mjs tests/tacho-rhmi.test.mjs
      - name: Build isolated production-derived app
        run: npm run build
      - name: Never deploy to production or the previous V14-V16 Worker
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const p = "dist/server/wrangler.json";
          const c = JSON.parse(fs.readFileSync(p, "utf8"));
          c.name = "tachocommand-app-v22-preview";
          c.d1_databases = [];
          c.r2_buckets = [];
          c.kv_namespaces = [];
          delete c.images;
          c.observability = {enabled: false};
          delete c.routes;
          delete c.route;
          delete c.zone_id;
          delete c.custom_domains;
          fs.writeFileSync(p, JSON.stringify(c));
          if (c.name !== "tachocommand-app-v22-preview" || c.d1_databases.length || c.routes || c.route) process.exit(1);
          NODE
      - name: Deploy new V22 isolated Worker only
        run: npx wrangler deploy --config dist/server/wrangler.json

      - name: Verify V22 installation assets exist on deployed preview origin
        run: |
          node --input-type=module <<'NODE'
          const origin="https://tachocommand-app-v22-preview.canicboban.workers.dev";
          const read=async(path)=>{
            for(let attempt=0;attempt<15;attempt++){
              const response=await fetch(origin+path,{redirect:"follow",cache:"no-store"});
              if(response.ok && new URL(response.url).origin===origin)return response;
              if(response.status!==404 && response.status!==503){
                throw new Error(path+" failed: "+response.status+" "+response.url);
              }
              if(attempt===14)throw new Error(path+" remains unavailable after propagation: "+response.status+" "+response.url);
              await new Promise(resolve=>setTimeout(resolve,4000));
            }
            throw new Error(path+" unreachable");
          };
          const root=await (await read("/")).text();
          if(!root.includes("Instaliraj V22 test aplikaciju")){
            throw new Error("V22 landing installation action is not rendered");
          }
          const manifestResponse=await read("/manifest.webmanifest");
          const manifest=await manifestResponse.json();
          if(manifest.short_name!=="TC V22 Test"||manifest.start_url!=="/app?v22-preview"||manifest.display!=="standalone"){
            throw new Error("Wrong preview manifest identity: "+JSON.stringify(manifest));
          }
          for(const path of ["/app?v22-preview","/sw.js","/icon-192.png","/icon-512.png"]){
            const response=await read(path);
            if(path.endsWith(".png") && !(response.headers.get("content-type")??"").includes("image/png")){
              throw new Error("PWA icon has wrong MIME type: "+path);
            }
            console.log("PWA_ASSET_OK",path,response.status);
          }
          console.log("V22_PWA_READY",JSON.stringify({origin,manifest:manifest.short_name,button:true}));
          NODE
