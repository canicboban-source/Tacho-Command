name: First-read UX isolated preview
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: tachocommand-first-read-preview
  cancel-in-progress: true
jobs:
  preview:
    if: (github.head_ref == 'feat/first-read-language-ux' || github.head_ref == 'feat/visual-driver-story') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:cloudflare
      - run: node --test tests/*.test.mjs
      - name: Prepare separate preview without databases, routes or app secrets
        run: node scripts/prepare-ux-preview.mjs
      - name: Deploy only the first-read preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/ux-preview.json
