name: TachoCommand V18 production-baseline isolated preview
on:
  push:
    branches:
      - fix/app-v18-card-recognition-ready-gate-20260923
    paths:
      - .github/workflows/v18-production-baseline-preview.yml
      - scripts/v17-production-baseline-safety.mjs
      - scripts/v18-card-recognition-ready.mjs
      - lib/app-v2-card-ready-gate.js
      - tests/v18-card-recognition-ready.test.mjs
      - lib/app-v2-phone-timeline.js
      - tests/v18-production-clock.test.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tachocommand-v18-production-baseline-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply only phone-timezone and landing UI changes over official main
        run: |
          set -eu
          sha256sum lib/app-v2-golden-card-browser-transport.js lib/app-v2-golden-card-protocol-core.js lib/app-v2-field-transport.js lib/app-v2-card-transport-controller-bridge.js > /tmp/production-card-transport.sha256
          node scripts/v17-production-baseline-safety.mjs
          node scripts/v18-card-recognition-ready.mjs
          sha256sum -c /tmp/production-card-transport.sha256
          git diff --exit-code -- lib/app-v2-golden-card-browser-transport.js lib/app-v2-golden-card-protocol-core.js lib/app-v2-field-transport.js lib/app-v2-card-transport-controller-bridge.js lib/app-v2-card-read-controller.js
          git diff --stat
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify production read, regression suite, phone time and safety copy
        run: |
          node --test tests/v17-production-clock.test.mjs tests/v18-card-recognition-ready.test.mjs tests/app-v2-card-read-ui-wiring.test.mjs tests/app-v2-field-transport.test.mjs tests/app-v2-golden-card-browser-transport.test.mjs tests/app-v2-field-session.test.mjs tests/app-v2-card-pipeline.test.mjs tests/app-v2-parser-card-adapter.test.mjs tests/field-proven-product-state.test.mjs tests/tacho-rhmi.test.mjs
      - name: Build isolated production-derived app
        run: npm run build
      - name: Never deploy to production or the previous V14-V16 Worker
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const p = "dist/server/wrangler.json";
          const c = JSON.parse(fs.readFileSync(p, "utf8"));
          c.name = "tachocommand-app-v18-preview";
          c.d1_databases = [];
          c.r2_buckets = [];
          c.kv_namespaces = [];
          delete c.images;
          c.observability = {enabled: false};
          delete c.routes;
          delete c.route;
          delete c.zone_id;
          delete c.custom_domains;
          fs.writeFileSync(p, JSON.stringify(c));
          if (c.name !== "tachocommand-app-v18-preview" || c.d1_databases.length || c.routes || c.route) process.exit(1);
          NODE
      - name: Deploy new V18 isolated Worker only
        run: npx wrangler deploy --config dist/server/wrangler.json
