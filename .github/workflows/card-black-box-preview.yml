name: Card black-box isolated preview

on:
  push:
    branches:
      - fix/safe-live-speed-gate-20260921
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy preview or print recent anonymous card telemetry
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - report

permissions:
  contents: read

concurrency:
  group: tachocommand-card-black-box-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TC_PREVIEW_DB: tachocommand-card-black-box-preview
      TC_PREVIEW_WORKER: tachocommand-card-black-box-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Resolve or create the isolated preview D1 database
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/tc-d1-list.json
          TC_PREVIEW_DB_UUID="$(node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const name = process.env.TC_PREVIEW_DB;
          const rows = JSON.parse(readFileSync("/tmp/tc-d1-list.json", "utf8"));
          const match = rows.find((row) => row.name === name);
          if (match?.uuid) process.stdout.write(match.uuid);
          NODE
          )"
          if [ -z "${TC_PREVIEW_DB_UUID:-}" ]; then
            npx wrangler d1 create "$TC_PREVIEW_DB" --location weur --binding DB
            npx wrangler d1 list --json > /tmp/tc-d1-list.json
            TC_PREVIEW_DB_UUID="$(node --input-type=module <<'NODE'
            import { readFileSync } from "node:fs";
            const name = process.env.TC_PREVIEW_DB;
            const rows = JSON.parse(readFileSync("/tmp/tc-d1-list.json", "utf8"));
            const matches = rows.filter((row) => row.name === name);
            if (matches.length !== 1 || !matches[0].uuid) throw new Error("Isolated preview D1 identity is ambiguous");
            process.stdout.write(matches[0].uuid);
            NODE
            )"
          fi
          echo "TC_PREVIEW_DB_UUID=$TC_PREVIEW_DB_UUID" >> "$GITHUB_ENV"

      - name: Create an isolated D1-only Wrangler configuration
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          writeFileSync("tc-preview-db.json", JSON.stringify({
            name: process.env.TC_PREVIEW_WORKER,
            compatibility_date: "2026-09-25",
            d1_databases: [{
              binding: "DB",
              database_name: process.env.TC_PREVIEW_DB,
              database_id: process.env.TC_PREVIEW_DB_UUID,
              migrations_dir: "drizzle",
            }],
          }));
          NODE

      - name: Print recent anonymous card telemetry
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'report' }}
        run: |
          npx wrangler d1 execute DB --config tc-preview-db.json --remote --json --command \
            "SELECT attempt_code,event,phase,outcome,error_code,packet_count,byte_count,duration_ms,datetime(created_at,'unixepoch') AS received_utc FROM technical_telemetry_events WHERE event LIKE 'card_%' ORDER BY id DESC LIMIT 40"

      - name: Lint
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy' }}
        run: npm run lint
      - name: Build
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy' }}
        run: npm run build
      - name: Test complete candidate
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy' }}
        run: node --test tests/*.test.mjs
      - name: Apply migrations only to the isolated preview database
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy' }}
        run: npx wrangler d1 migrations apply DB --config tc-preview-db.json --remote

      - name: Bind only the isolated D1 database and remove production routes
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "dist/server/wrangler.json";
          const config = JSON.parse(readFileSync(path, "utf8"));
          config.name = process.env.TC_PREVIEW_WORKER;
          config.d1_databases = [{
            binding: "DB",
            database_name: process.env.TC_PREVIEW_DB,
            database_id: process.env.TC_PREVIEW_DB_UUID,
          }];
          config.r2_buckets = [];
          config.kv_namespaces = [];
          delete config.routes;
          delete config.route;
          delete config.zone_id;
          delete config.custom_domains;
          delete config.images;
          config.observability = { enabled: false };
          if (config.name !== process.env.TC_PREVIEW_WORKER
              || config.d1_databases.length !== 1
              || config.d1_databases[0].database_name !== process.env.TC_PREVIEW_DB
              || config.routes || config.route || config.zone_id || config.custom_domains) {
            throw new Error("Preview configuration crossed the production boundary");
          }
          writeFileSync(path, JSON.stringify(config));
          NODE

      - name: Deploy only the isolated Worker
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy' }}
        run: npx wrangler deploy --config dist/server/wrangler.json

      - name: Verify app and telemetry storage
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy' }}
        run: |
          node --input-type=module <<'NODE'
          const origin = `https://${process.env.TC_PREVIEW_WORKER}.canicboban.workers.dev`;
          async function read(path) {
            for (let attempt = 0; attempt < 12; attempt++) {
              const response = await fetch(origin + path, { cache: "no-store" });
              if (response.ok) return response;
              if (attempt === 11) throw new Error(`${path} failed: ${response.status}`);
              await new Promise((resolve) => setTimeout(resolve, 3000));
            }
          }
          const app = await (await read("/app")).text();
          if (!app.includes("TachoCommand")) throw new Error("Preview app identity missing");
          const telemetry = await (await read("/api/technical-telemetry")).json();
          if (telemetry.status !== "ready") throw new Error("Isolated telemetry database is not ready");
          console.log("CARD_BLACK_BOX_PREVIEW", origin + "/app");
          NODE
