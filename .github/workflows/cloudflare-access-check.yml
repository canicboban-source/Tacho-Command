name: Cloudflare access check

on:
  push:
    branches:
      - infra/independent-cloudflare-hosting-20260919
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-access:
    name: Verify restricted Cloudflare access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify D1 database access
        run: npx wrangler d1 info tachocommand-prod
